services:
  web:
    image: nginx:alpine
    networks:
      - NazarNet
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.nazar-chat.rule=Host(`nazar-chat.aisouthside.com`)"
        - "traefik.http.routers.nazar-chat.entrypoints=websecure"
        - "traefik.http.routers.nazar-chat.tls=true"
        - "traefik.http.services.nazar-chat.loadbalancer.server.port=80"

networks:
  NazarNet:
    external: true
